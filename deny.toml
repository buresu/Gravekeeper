# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained notices (not vulnerabilities) for crates merged into zbus 6. They are
    # pulled in by zbus 5 via ksni (tray-icon's Linux backend) and go away once ksni moves
    # to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: transitive via ksni -> zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: transitive via ksni -> zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: transitive via ksni -> zbus 5" },
]

[licenses]
# Permissive licenses compatible with distributing Gravekeeper under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    # Mozilla's root certificate data (webpki-root-certs, via rustls-platform-verifier).
    "CDLA-Permissive-2.0",
    # Fonts bundled by epaint (egui's default fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
