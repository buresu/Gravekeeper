[package]
name = "gravekeeper"
description = "Desktop application supervisor and operations tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gravekeeper-core.workspace = true
eframe = { workspace = true, features = ["clipboard", "default_fonts", "system_fonts", "wayland", "x11", "persistence"] }
egui_extras.workspace = true
jiff.workspace = true
rfd.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }
tray-icon.workspace = true
# Only for waiting on signals in headless mode.
tokio = { workspace = true, features = ["rt", "signal", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }
windows-registry.workspace = true

[dev-dependencies]
# Headless rendering of the UI for interaction tests and screenshots.
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
# The system font fallback eframe's `system_fonts` adds at runtime, for the test harness.
egui_system_font_provider = "0.37"
png = "0.18"
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
embed-resource = "3"

[features]
default = ["glow", "http"]
# Webhook delivery (see gravekeeper-core). Turn off only to type-check other targets.
http = ["gravekeeper-core/http"]
# Renderer backends. Exactly one is used at runtime; glow is preferred when both are enabled.
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[lints]
workspace = true

# Installers, built with cargo-packager (see docs/distribution.md):
#   cargo packager -p gravekeeper --release --formats deb,appimage
[package.metadata.packager]
product-name = "Gravekeeper"
identifier = "com.gravekeeper.app"
description = "Supervise and operate applications"
long-description = "Starts, stops and restarts applications, captures their output, runs schedules, monitors resources and sends webhook notifications."
category = "Utility"
license-file = "../../LICENSE"
before-packaging-command = "cargo build --release --locked -p gravekeeper"
out-dir = "../../target/packages"
icons = [
    "../../packaging/icons/32x32.png",
    "../../packaging/icons/128x128.png",
    "../../packaging/icons/256x256.png",
    "../../packaging/icons/512x512.png",
    "../../packaging/icons/gravekeeper.ico",
    "../../packaging/icons/gravekeeper.icns",
]

[package.metadata.packager.deb]
desktop-template = "../../packaging/linux/gravekeeper.desktop.hbs"
section = "utils"
# Loaded at runtime: xkbcommon and EGL by winit/glow, fontconfig for system fonts.
depends = ["libc6", "libgcc-s1", "libxkbcommon0", "libfontconfig1", "libegl1"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "11.0"

