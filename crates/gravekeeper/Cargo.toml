[package]
name = "gravekeeper"
description = "Desktop application supervisor and operations tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gravekeeper-core.workspace = true
eframe = { workspace = true, features = ["default_fonts", "system_fonts", "wayland", "x11"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }
tray-icon.workspace = true

[features]
default = ["glow"]
# Renderer backends. Exactly one is used at runtime; glow is preferred when both are enabled.
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[lints]
workspace = true
