[workspace]
resolver = "3"
members = ["crates/gravekeeper-core", "crates/gravekeeper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
gravekeeper-core = { path = "crates/gravekeeper-core", default-features = false }

eframe = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
process-wrap = { version = "10", default-features = false }
# rustls with the OS certificate store; no OpenSSL needed.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# Native file dialogs; on Linux through the XDG desktop portal (no GTK).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false }
tempfile = "3"
tokio = { version = "1.53", default-features = false }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
# The ksni backend (StatusNotifierItem over D-Bus) avoids GTK on Linux; it is a no-op elsewhere.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
windows-registry = "0.100"
# Same zbus as ksni already uses; only for checking whether a tray host is running.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
