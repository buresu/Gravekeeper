[workspace]
resolver = "3"
members = ["crates/gravekeeper-core", "crates/gravekeeper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
gravekeeper-core = { path = "crates/gravekeeper-core" }

eframe = { version = "0.37", default-features = false }
process-wrap = { version = "10", default-features = false }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false }
tokio = { version = "1.53", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
# The ksni backend (StatusNotifierItem over D-Bus) avoids GTK on Linux; it is a no-op elsewhere.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
