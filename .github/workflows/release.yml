name: Release

# Builds installers on each OS. Pushing a tag like `v0.2.0` also publishes them as a draft
# GitHub release (see docs/distribution.md, "Making a release"); running the workflow by
# hand only uploads them as build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  # A tag must name the version in Cargo.toml, so the packages and `--version` agree with it.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gravekeeper") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)."
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: ${{ matrix.name }}
    needs: [version, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low for .deb and AppImage.
          # Each architecture is built natively (linuxdeploy cannot cross-package AppImages).
          - name: linux-x64
            os: ubuntu-22.04
            formats: deb,appimage
          - name: linux-arm64
            os: ubuntu-22.04-arm
            formats: deb,appimage
          - name: windows
            os: windows-latest
            formats: nsis
          - name: macos
            os: macos-latest
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}
      - name: Build installers
        run: cargo packager -p gravekeeper --release --formats ${{ matrix.formats }}
        env:
          # linuxdeploy (AppImage) runs without FUSE on CI.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Matches `minimum-system-version` in crates/gravekeeper/Cargo.toml.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Code signing is configured through secrets when available (docs/distribution.md):
          # Windows: certificate in the store + windows.certificate-thumbprint, or sign-command.
          # macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #        APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID for notarization.
      - uses: actions/upload-artifact@v4
        with:
          name: gravekeeper-${{ matrix.name }}
          path: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*-setup.exe
            target/packages/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          draft: true
          # `v1.0.0-rc.1` and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Installation notes, followed by the generated list of changes.
          body_path: .github/release-notes.md
          generate_release_notes: true
